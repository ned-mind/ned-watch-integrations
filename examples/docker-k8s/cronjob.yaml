# Kubernetes CronJob watched by Ned. kubectl apply -f cronjob.yaml
# The image is the Dockerfile in this folder (ned-run as the entrypoint). Ned fires if a run is still going after
# 30 minutes (overrun), or if no run succeeds for a day (deadman).
apiVersion: v1
kind: Secret
metadata:
  name: ned-watch
type: Opaque
stringData:
  NED_AGENT_KEY: "nw_replace_me"                         # from your first registration (nedwatch setup)
  NED_CALLBACK_URL: "https://your-agent.example/hooks/ned"
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: nightly-report
spec:
  schedule: "0 3 * * *"
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 600
  jobTemplate:
    spec:
      backoffLimit: 0                                   # a failed run stays failed; Ned's deadman notices
      activeDeadlineSeconds: 3600
      template:
        spec:
          restartPolicy: Never
          containers:
            - name: report
              image: registry.example.com/nightly-report:latest
              command: ["ned-run", "--ref", "k8s", "--name", "nightly-report", "--max", "30m", "--every", "1d", "--"]
              args: ["/app/job.sh"]
              envFrom:
                - secretRef:
                    name: ned-watch
