name: publish-npm
# Tag js-vX.Y.Z (matching js/package.json) to release ned-watch to npm. The very first release uses the NPM_TOKEN
# repository secret (the package must exist before npm's trusted publishing can be set up); after that, trusted
# publishing (OIDC) and the secret is deleted.
on:
  push:
    tags: ["js-v*"]

permissions:
  contents: read

jobs:
  test:
    uses: ./.github/workflows/test.yml

  publish:
    needs: test
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
      - run: npm install -g npm@latest
      - name: Build
        run: cd js && npm install --no-audit --no-fund && node build.mjs
      - name: Publish (tests already passed above)
        run: cd js && npm publish --access public --provenance --ignore-scripts
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
