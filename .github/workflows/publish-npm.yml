name: publish-npm
# Tag js-vX.Y.Z (matching js/package.json) to release @nedwatch/ned-watch to npm. Trusted publishing (OIDC): the npm
# package trusts this workflow in this repo, so there is no npm token anywhere. (The first release, 0.1.0, used a one-time
# token because the package had to exist first; that token and secret were deleted on 2026-10-06.)
on:
  push:
    tags: ["js-v*"]

permissions:
  contents: read

jobs:
  test:
    uses: ./.github/workflows/test.yml

  publish:
    needs: test
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
      - run: npm install -g npm@latest
      - name: Build
        run: cd js && npm install --no-audit --no-fund && node build.mjs
      - name: Publish (tests already passed above)
        run: cd js && npm publish --access public --provenance --ignore-scripts
