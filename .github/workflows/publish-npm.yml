name: publish-npm
# Tag js-vX.Y.Z (matching js/package.json) to release @nedwatch/ned-watch to npm. Trusted publishing (OIDC): the npm
# package trusts this workflow in this repo, so there is no npm token anywhere. (The first release, 0.1.0, used a one-time
# token because the package had to exist first; that token and secret were deleted on 2026-10-06.)
on:
  push:
    tags: ["js-v*"]

permissions:
  contents: read

jobs:
  test:
    uses: ./.github/workflows/test.yml

  publish:
    needs: test
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: "22"
          # no registry-url: with it, setup-node writes a placeholder _authToken into .npmrc and npm sends that instead
          # of exchanging the OIDC token, and the registry answers 404 (seen on the first 0.1.1 run, 2026-10-07)
      # pinned, not @latest: trusted publishing (OIDC) needs npm >= 11.5.1, and Node 22 bundles npm 10.x
      - run: npm install -g npm@11.6.2
      - name: Build
        # no package-lock.json in js/ (adding one is out of scope), so npm install rather than npm ci; no install scripts
        run: cd js && npm install --ignore-scripts --no-audit --no-fund && node build.mjs
      - name: Publish (tests already passed above)
        run: cd js && npm publish --access public --provenance --ignore-scripts
